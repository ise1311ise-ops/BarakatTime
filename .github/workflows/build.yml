name: Build BarakatTime firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and esptool
        run: pip install -U platformio esptool

      - name: Fetch libraries bundled by Waveshare (проверенные версии под эту плату)
        run: |
          curl -L -o ws_demo.zip https://github.com/waveshareteam/ESP32-S3-Touch-LCD-1.69/archive/refs/heads/main.zip
          unzip -q ws_demo.zip
          mkdir -p lib
          SRC=$(find ESP32-S3-Touch-LCD-1.69-main -type d -iname "libraries" | head -n1)
          if [ -z "$SRC" ]; then
            echo "Папка libraries не найдена, вот структура репозитория для отладки:"
            find ESP32-S3-Touch-LCD-1.69-main -maxdepth 5 -type d
            exit 1
          fi
          echo "Нашёл библиотеки тут: $SRC"
          ls -la "$SRC"
          cp -r "$SRC"/* lib/

      - name: Build firmware
        run: pio run -e esp32-s3

      - name: Build filesystem image (LittleFS)
        run: pio run -e esp32-s3 --target buildfs

      - name: Merge images into one flashable .bin
        run: |
          BUILD_DIR=.pio/build/esp32-s3
          python -m esptool --chip esp32s3 merge_bin -o BarakatTime_merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0       $BUILD_DIR/bootloader.bin \
            0x8000    $BUILD_DIR/partitions.bin \
            0x10000   $BUILD_DIR/firmware.bin \
            0xC90000  $BUILD_DIR/littlefs.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BarakatTime-firmware
          path: |
            .pio/build/esp32-s3/firmware.bin
            .pio/build/esp32-s3/bootloader.bin
            .pio/build/esp32-s3/partitions.bin
            .pio/build/esp32-s3/littlefs.bin
            BarakatTime_merged.bin
