[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; native USB (не UART-мост) — без этого Serial.println() не будет работать
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; на плате 16MB flash + 8MB octal PSRAM
board_build.partitions = default_16MB.csv
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.5
    lewisxhe/SensorLib @ 0.4.1
    ; Arduino_DriveBus (драйвер тача CST816T) не опубликована в реестре PlatformIO —
    ; GitHub Actions скачивает её отдельно из официального репозитория Waveshare
    ; и кладёт в lib/ перед сборкой (см. .github/workflows/build.yml)
